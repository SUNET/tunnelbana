[workspace]
resolver = "2"
members = [
    "crates/tunnelbana-core",
    "crates/tunnelbana-oidc",
    "crates/tunnelbana-plugins",
    "crates/tunnelbana-python",
    "crates/tunnelbana",
]
exclude = ["vendor/pythonize"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "BSD-2-Clause"
rust-version = "1.89"

[workspace.dependencies]
grindvakt = "0.12.0"
# Make ML-DSA and composite ML-DSA available to OIDC signing and verification.
jose-rs = { version = "0.11.0", default-features = false, features = ["post-quantum"] }
gamlastan = "0.11.0"
gamlastan-mdq = "0.11.0"

# Async / web
actix-web = "4.19.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

# Templating
# Tera 2 removes template syntax and filters used by existing deployments.
tera = "1.20.1"

# Crypto helpers for PEM key loading (PEM -> SoftwareKey -> jose Jwk)
kryptering = { version = "0.7.1", default-features = false }
rsa = "0.10"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { version = "3.0", features = ["pkcs8"] }
pkcs8 = "0.11"
pem = "4"
sec1 = "0.8"
base64 = "0.23.1"
hex = "0.4.3"
sha2 = "0.11"
md-5 = "0.11"
hkdf = "0.13"
rand = "0.10"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors / utilities
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
url = "2"
percent-encoding = "2"
form_urlencoded = "1"
regex = "1"
bytes = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

# Embedded CPython support. Keep these exact and isolated to tunnelbana-python.
pyo3 = { version = "=0.30.1", default-features = false }
pythonize = { version = "=0.29.0", features = ["arbitrary_precision"] }

# Remove this compatibility patch when Pythonize supports PyO3 0.30.
[patch.crates-io]
pythonize = { path = "vendor/pythonize" }
