name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: rust:1-trixie
    timeout-minutes: 30
    env:
      PYO3_PYTHON: /usr/bin/python3.13

    steps:
      - name: Install CPython build and runtime packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3.13 python3.13-dev
          rm -rf /var/lib/apt/lists/*

      - name: Checkout tunnelbana
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Tests
        run: cargo test --locked --verbose

  sverigeid-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout Tunnelbana
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tunnelbana

      - name: Checkout Sweden Connect reference federation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: swedenconnect/local-federation
          ref: 5b67bedb42230fff6b8d89fb26c80e2084d2eb7b
          path: local-federation
      - name: Install local gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlsec1
          # This disposable runner resolves the fixture directly. The proxy
          # process loads the fixture CA without privileged namespace mounts.
          echo '127.0.0.1 local.fed.swedenconnect.se' | sudo tee -a /etc/hosts
          pipx install uv==0.13.6
          cargo install just --locked --version 1.53.0
          uv python install 3.13
          interpreter="$(uv python find --managed-python 3.13)"
          echo "PYO3_PYTHON=$interpreter" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$(dirname "$interpreter")")/lib" >> "$GITHUB_ENV"
      - name: Run Sweden Connect acceptance tests
        env:
          SVERIGEID_RUNNER_HOSTS: "1"
        working-directory: tunnelbana
        run: just test-sverigeid-local
      - name: Preserve the redacted evidence
        if: always()
        run: |
          if test -f tunnelbana/target/sverigeid-local-report.json; then
            cat tunnelbana/target/sverigeid-local-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
